name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-go:
    name: Test Go Services & SAT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Verify Go Modules
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Test Suite (Unit & Integration)
        run: go test -v -race ./...

      - name: Run Problem Parser Fuzzing
        run: go test -fuzz=FuzzLoadPackage -fuzztime=10s ./pkg/problems

      - name: Run Setup Acceptance & Escape Corpus Tests
        run: |
          go test -v ./tests/...
          go test -v -run "TestEscapeCorpus|TestSetupAcceptance" ./api/internal/integration/...

  test-judge:
    name: Test Rust Judge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Cargo check & test
        run: |
          cargo check --manifest-path judge/Cargo.toml
          cargo test --manifest-path judge/Cargo.toml

  test-web:
    name: Test Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd web
          npm ci || npm install
          npm run build

  build-containers:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [test-go, test-web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/api.Dockerfile
          push: false
          tags: codebench-api:ci-test

      - name: Build Judge Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/judge.Dockerfile
          push: false
          tags: codebench-judge:ci-test
